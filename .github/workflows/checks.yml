name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/postman" postman-cli@1.73.0 --no-audit --no-fund
          echo "$RUNNER_TEMP/postman/node_modules/.bin" >> "$GITHUB_PATH"
      - run: bash -n setup_database.sh
      - run: python3 tests/test_installer.py
      - name: Check root setup and service-user access
        if: runner.os == 'Linux'
        run: sudo env PATH="$PATH" JAVA_HOME="$JAVA_HOME" python3 tests/test_installer.py
  elasticsearch:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and start Elasticsearch
        env:
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        run: |
          export ES_JAVA_HOME="$JAVA_HOME"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 2 -O https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.13.3-linux-x86_64.tar.gz
          curl --fail --silent --show-error --location --retry 2 -O https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.13.3-linux-x86_64.tar.gz.sha512
          sha512sum -c elasticsearch-8.13.3-linux-x86_64.tar.gz.sha512
          tar -xzf elasticsearch-8.13.3-linux-x86_64.tar.gz
          cd elasticsearch-8.13.3
          bin/elasticsearch-plugin install --batch "file://$GITHUB_WORKSPACE/es-ipgeo-ingest-processor.zip"
          mkdir config/ipgeo
          cp "$GITHUB_WORKSPACE"/tests/fixtures/db-* config/ipgeo/
          bin/elasticsearch -d -p "$RUNNER_TEMP/es.pid" \
            -Ecluster.name=ipgeo-package-check -Enetwork.host=127.0.0.1 \
            -Ehttp.port=19201 -Etransport.port=19301 -Ediscovery.type=single-node \
            -Expack.security.enabled=false -Expack.security.autoconfiguration.enabled=false \
            -Expack.ml.enabled=false -Eingest.geoip.downloader.enabled=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19201/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat logs/ipgeo-package-check.log
          exit 1
      - name: Check the installed plugin
        env:
          ELASTICSEARCH_TEST_URL: http://127.0.0.1:19201
          ELASTICSEARCH_TEST_CONFIG: ${{ runner.temp }}/elasticsearch-8.13.3/config
        run: python3 tests/test_elasticsearch.py
      - name: Stop Elasticsearch
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/es.pid" ]; then kill "$(cat "$RUNNER_TEMP/es.pid")"; fi
